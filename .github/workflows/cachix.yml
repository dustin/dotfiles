name: Build & cache home-manager configs

# Builds each Linux home-manager configuration natively on its own
# architecture and pushes the results to cachix, so machines can substitute
# binaries instead of compiling them.
#
# The x86_64-linux hosts (aws, bee1, bee2) all evaluate against the same
# nixpkgs, so their home.packages overlap heavily. Rather than chaining those
# three jobs just to get cache reuse, `shared-x86_64-linux` builds the union
# of their packages once (flake output `packages.x86_64-linux.ci-shared`,
# derived automatically from each host's own config -- see flake.nix) and
# pushes it to cachix. aws/bee1/bee2 then depend on that job and run
# concurrently, substituting the shared packages instead of rebuilding them.
#
# pied is aarch64-linux, a different architecture that can't substitute from
# or for the x86_64 jobs, so it runs independently.
#
# The darwin machines (dsmac, dsstudio) are both aarch64-darwin and build on
# GitHub's Apple Silicon macOS runners. They're built together in a single
# `darwin` job: one `nix build` of both activation packages shares their
# common dependencies without needing a separate shared-packages job.
on:
  push:
    branches: [master]
    paths:
      - "home-manager/**"
  workflow_dispatch: {}

jobs:
  shared-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build packages shared by aws/bee1/bee2
        working-directory: home-manager
        run: nix build '.#packages.x86_64-linux.ci-shared' --no-link -L

  aws:
    needs: shared-x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build home-manager activation package for aws
        working-directory: home-manager
        run: nix build '.#homeConfigurations."dustin@aws".activationPackage' --no-link -L

  bee1:
    needs: shared-x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build home-manager activation package for bee1
        working-directory: home-manager
        run: nix build '.#homeConfigurations."dustin@bee1".activationPackage' --no-link -L

  bee2:
    needs: shared-x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build home-manager activation package for bee2
        working-directory: home-manager
        run: nix build '.#homeConfigurations."dustin@bee2".activationPackage' --no-link -L

  pied:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build home-manager activation package for pied
        working-directory: home-manager
        run: nix build '.#homeConfigurations."dustin@pied".activationPackage' --no-link -L

  darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
      - uses: cachix/cachix-action@v17
        with:
          name: dustin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Build home-manager activation packages for dsmac and dsstudio
        working-directory: home-manager
        run: |
          nix build --no-link -L \
            '.#homeConfigurations."dustin@dsmac".activationPackage' \
            '.#homeConfigurations."dustin@dsstudio".activationPackage'
